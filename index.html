<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Penilaian - SMPN 3 Balikpapan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hide { display: none !important; }
        .score-input::-webkit-inner-spin-button, 
        .score-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- PORTAL LOGIN -->
    <div id="login-portal" class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-500 to-indigo-600 px-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
            <img src="https://cdn-icons-png.flaticon.com/512/3428/3428074.png" alt="Education" class="w-32 h-32 mx-auto mb-4 animate-bounce">
            <h1 class="text-2xl font-bold text-gray-800">PORTAL GURU</h1>
            <h2 class="text-lg text-blue-600 font-semibold mb-1">SMP NEGERI 3 BALIKPAPAN</h2>
            <p class="text-sm text-gray-500 mb-6">Wahyudi Kahar, S.Pd</p>

            <form id="login-form" class="space-y-4">
                <input type="email" id="email" placeholder="Masukkan Email Anda" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <input type="password" id="password" placeholder="Masukkan Password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition flex justify-center items-center">
                    <span>MASUK</span>
                </button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD UTAMA -->
    <div id="dashboard" class="hide min-h-screen flex flex-col">
        <nav class="bg-blue-700 text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <i class="fa-solid fa-graduation-cap text-2xl mr-3"></i>
                        <div>
                            <span class="font-bold text-lg block leading-tight">Penilaian Siswa Terpusat</span>
                            <span class="text-xs text-blue-200">Wahyudi Kahar, S.Pd - SMPN 3 Balikpapan</span>
                        </div>
                    </div>
                    <div>
                        <button id="btn-logout" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-md text-sm font-semibold transition">
                            <i class="fa-solid fa-sign-out-alt mr-1"></i> Keluar
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full">
            <div class="bg-white p-4 rounded-lg shadow-md mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                    <!-- Pilihan Kelas -->
                    <select id="select-kelas" class="px-4 py-2 border rounded-md font-semibold bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="9A">Kelas 9A</option><option value="9B">Kelas 9B</option>
                        <option value="9C">Kelas 9C</option><option value="9D">Kelas 9D</option>
                        <option value="9E">Kelas 9E</option><option value="9F">Kelas 9F</option>
                        <option value="9G">Kelas 9G</option><option value="9H">Kelas 9H</option>
                        <option value="9I">Kelas 9I</option><option value="9J">Kelas 9J</option>
                        <option value="9K">Kelas 9K</option>
                    </select>

                    <!-- Pilihan Menu / Kategori -->
                    <select id="select-kategori" class="px-4 py-2 border rounded-md font-semibold bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="MASTER_SISWA">📂 Master Data Siswa (Import 1x)</option>
                        <option value="Tugas">Tugas Harian (10 Kolom)</option>
                        <option value="Praktik">Nilai Praktik (3 Kolom)</option>
                        <option value="UH">Ulangan Harian (5 Kolom)</option>
                        <option value="STS">Sumatif Tengah Semester (STS)</option>
                        <option value="PAS">Penilaian Akhir Semester (PAS)</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <input type="file" id="file-excel" accept=".xlsx, .xls" class="hidden">
                    <button id="btn-import" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm transition">
                        <i class="fa-solid fa-file-import mr-1"></i> Import Excel Siswa
                    </button>
                    <button id="btn-export" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm transition">
                        <i class="fa-solid fa-file-export mr-1"></i> Export Excel
                    </button>
                </div>
            </div>

            <!-- Area Tabel & Tombol Simpan Utama -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="p-4 bg-gray-50 border-b flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h3 class="font-bold text-gray-700" id="table-title">Data Siswa</h3>
                    <div class="flex gap-2 flex-wrap">
                        <button id="btn-add" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-sm shadow">
                            <i class="fa-solid fa-plus"></i> Tambah Siswa Manual
                        </button>
                        <button id="btn-delete-selected" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm hide shadow">
                            <i class="fa-solid fa-trash"></i> Hapus Terpilih
                        </button>
                        <!-- TOMBOL SAVE SPESIAL UNTUK NILAI -->
                        <button id="btn-save-grades" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded text-sm font-bold shadow hide">
                            <i class="fa-solid fa-save mr-1"></i> Simpan Semua Nilai
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-600">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-200" id="table-head">
                            <!-- Kolom dinamis -->
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="15" class="text-center py-8">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form Tambah/Edit Siswa -->
    <div id="modal-form" class="fixed inset-0 bg-black bg-opacity-50 z-50 hide flex items-center justify-center px-4">
        <div class="bg-white rounded-lg w-full max-w-lg p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-blue-700" id="modal-title">Tambah Siswa</h3>
            <form id="data-form" class="space-y-4">
                <input type="hidden" id="doc-id">
                <div>
                    <label class="block text-sm font-semibold mb-1">Nama Lengkap</label>
                    <input type="text" id="input-nama" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 uppercase" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">NIS / NISN</label>
                    <input type="text" id="input-nis" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" id="btn-close-modal" class="px-4 py-2 bg-gray-300 text-gray-700 font-semibold rounded hover:bg-gray-400">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 shadow-md">Simpan Data Siswa</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FIREBASE & LOGIKA UTAMA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, writeBatch, getDocs, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAK8Vl0C0_aul9saRG2baMFnHfqrKNNwhc",
            authDomain: "penilaiansbd.firebaseapp.com",
            projectId: "penilaiansbd",
            storageBucket: "penilaiansbd.firebasestorage.app",
            messagingSenderId: "1033830056887",
            appId: "1:1033830056887:web:570f3cde6f2c78830e5e32",
            measurementId: "G-KJFP1CMTLQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        setPersistence(auth, browserLocalPersistence).catch((error) => console.error(error));

        let currentKelas = localStorage.getItem('activeKelas') || '9A';
        let currentKategori = localStorage.getItem('activeKategori') || 'MASTER_SISWA';
        let masterSiswa = []; 
        let dataNilai = {};   
        let maxColumns = 0;
        let unsubscribeSiswa = null;
        let unsubscribeNilai = null;

        const portal = document.getElementById('login-portal');
        const dashboard = document.getElementById('dashboard');
        const selectKelas = document.getElementById('select-kelas');
        const selectKategori = document.getElementById('select-kategori');
        const tableTitle = document.getElementById('table-title');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        const btnSaveGrades = document.getElementById('btn-save-grades');
        
        selectKelas.value = currentKelas;
        selectKategori.value = currentKategori;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                portal.classList.add('hide'); 
                dashboard.classList.remove('hide'); 
                initApp();
            } else {
                dashboard.classList.add('hide'); 
                portal.classList.remove('hide');
                cleanupListeners();
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<div class="loader mr-2"></div> Memproses...';
            btn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                Swal.fire({icon: 'success', title: 'Berhasil Login', timer: 1500, showConfirmButton: false});
            } catch (error) {
                Swal.fire({icon: 'error', title: 'Gagal Masuk', text: 'Email atau Password salah!'});
            } finally {
                btn.innerHTML = '<span>MASUK</span>'; btn.disabled = false;
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            Swal.fire({ title: 'Keluar aplikasi?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Keluar'
            }).then((result) => { if (result.isConfirmed) signOut(auth); });
        });

        function cleanupListeners() {
            if (unsubscribeSiswa) unsubscribeSiswa();
            if (unsubscribeNilai) unsubscribeNilai();
        }

        function initApp() {
            localStorage.setItem('activeKelas', currentKelas);
            localStorage.setItem('activeKategori', currentKategori);
            
            cleanupListeners();
            
            const masterColName = `master_siswa_${currentKelas}`;
            tableBody.innerHTML = `<tr><td colspan="15" class="text-center py-8"><div class="loader mx-auto"></div></td></tr>`;

            unsubscribeSiswa = onSnapshot(collection(db, masterColName), (snapshot) => {
                masterSiswa = [];
                snapshot.forEach((doc) => { masterSiswa.push({ id: doc.id, ...doc.data() }); });
                masterSiswa.sort((a, b) => a.nama.localeCompare(b.nama));

                if (currentKategori === 'MASTER_SISWA') {
                    renderMasterSiswaTable();
                } else {
                    fetchNilaiAndRender();
                }
            }, (error) => {
                tableBody.innerHTML = `<tr><td colspan="15" class="text-center py-8 text-red-500 font-bold">Gagal memuat master siswa. Cek Firestore Rules.</td></tr>`;
            });
        }

        function fetchNilaiAndRender() {
            const nilaiColName = `nilai_${currentKelas}_${currentKategori}`;
            if (unsubscribeNilai) unsubscribeNilai();

            unsubscribeNilai = onSnapshot(collection(db, nilaiColName), (snapshot) => {
                dataNilai = {};
                snapshot.forEach((doc) => { 
                    dataNilai[doc.id] = doc.data(); 
                });
                renderNilaiTable();
            });
        }

        function renderMasterSiswaTable() {
            tableTitle.innerText = `Master Data Siswa - Kelas ${currentKelas} (Terpusat)`;
            if(btnSaveGrades) btnSaveGrades.classList.add('hide');

            let thHTML = `
                <tr>
                    <th scope="col" class="px-4 py-3 w-10"><input type="checkbox" id="check-all" class="w-4 h-4 rounded border-gray-300"></th>
                    <th scope="col" class="px-4 py-3">No</th>
                    <th scope="col" class="px-4 py-3">Nama Lengkap</th>
                    <th scope="col" class="px-4 py-3">NIS / NISN</th>
                    <th scope="col" class="px-4 py-3 text-center">Aksi</th>
                </tr>
            `;
            tableHead.innerHTML = thHTML;

            if (masterSiswa.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500">Belum ada data siswa di kelas ${currentKelas}. Silakan <b>Import Excel Siswa</b> atau klik <b>Tambah Siswa Manual</b> lalu klik Simpan.</td></tr>`;
                return;
            }

            let html = '';
            masterSiswa.forEach((siswa, index) => {
                html += `
                    <tr class="bg-white border-b hover:bg-gray-50">
                        <td class="px-4 py-3"><input type="checkbox" class="check-item w-4 h-4 rounded border-gray-300" value="${siswa.id}"></td>
                        <td class="px-4 py-3 font-semibold">${index + 1}</td>
                        <td class="px-4 py-3 font-bold text-gray-900">${siswa.nama}</td>
                        <td class="px-4 py-3 text-gray-500">${siswa.nis || '-'}</td>
                        <td class="px-4 py-3 text-center flex gap-2 justify-center">
                            <button onclick="editSiswa('${siswa.id}')" class="bg-gray-100 text-gray-600 hover:bg-blue-600 hover:text-white px-2 py-1 rounded transition" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteSiswaMaster('${siswa.id}')" class="bg-red-100 text-red-600 hover:bg-red-600 hover:text-white px-2 py-1 rounded transition" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
            setupCheckAll();
        }

        function renderNilaiTable() {
            tableTitle.innerText = `Penilaian ${currentKategori} - Kelas ${currentKelas}`;
            if(btnSaveGrades) btnSaveGrades.classList.remove('hide');
            
            if (currentKategori === 'Tugas') maxColumns = 10;
            else if (currentKategori === 'UH') maxColumns = 5;
            else if (currentKategori === 'Praktik') maxColumns = 3; 
            else maxColumns = 1;

            let thHTML = `
                <tr>
                    <th scope="col" class="px-4 py-3">No</th>
                    <th scope="col" class="px-4 py-3 whitespace-nowrap">Nama Siswa</th>
                    <th scope="col" class="px-4 py-3">NISN</th>
            `;
            let labelKolom = currentKategori === 'Tugas' ? 'T' : currentKategori === 'UH' ? 'UH' : currentKategori === 'Praktik' ? 'P' : 'N';
            
            for (let i = 1; i <= maxColumns; i++) {
                thHTML += `<th scope="col" class="px-2 py-3 text-center">${labelKolom}${i}</th>`;
            }
            thHTML += `<th scope="col" class="px-4 py-3 text-center">Rata-rata</th></tr>`;
            tableHead.innerHTML = thHTML;

            if (masterSiswa.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="15" class="text-center py-8 text-orange-600 font-semibold">Master siswa untuk kelas ${currentKelas} masih kosong!<br>Silakan pilih menu <b>"Master Data Siswa"</b> di atas lalu Import Excel siswa terlebih dahulu.</td></tr>`;
                if(btnSaveGrades) btnSaveGrades.classList.add('hide');
                return;
            }

            let html = '';
            masterSiswa.forEach((siswa, index) => {
                const nilaiObj = dataNilai[siswa.id] || {};
                
                let total = 0; let count = 0;
                for (let i = 1; i <= maxColumns; i++) {
                    let val = parseFloat(nilaiObj[`n${i}`]);
                    if (!isNaN(val) && val > 0) { total += val; count++; }
                }
                let rata2 = count > 0 ? (total / count).toFixed(1) : '-';

                html += `
                    <tr class="bg-white border-b hover:bg-gray-50">
                        <td class="px-4 py-3 font-semibold">${index + 1}</td>
                        <td class="px-4 py-3 font-bold text-gray-900 whitespace-nowrap">${siswa.nama}</td>
                        <td class="px-4 py-3 text-gray-500">${siswa.nis || '-'}</td>
                `;

                for (let i = 1; i <= maxColumns; i++) {
                    let val = (nilaiObj[`n${i}`] !== undefined && nilaiObj[`n${i}`] !== null) ? nilaiObj[`n${i}`] : '';
                    html += `
                        <td class="px-2 py-2 text-center">
                            <input type="number" min="0" max="100" 
                                data-id="${siswa.id}" 
                                data-field="n${i}" 
                                value="${val}" 
                                class="score-input w-16 text-center border border-gray-300 rounded p-1 text-sm focus:ring-2 focus:ring-blue-500 bg-yellow-50/40">
                        </td>
                    `;
                }

                html += `
                        <td class="px-4 py-3 text-center font-bold text-blue-600 bg-blue-50" id="avg-${siswa.id}">${rata2}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        }

        function setupCheckAll() {
            const checkAll = document.getElementById('check-all');
            if(checkAll) {
                checkAll.addEventListener('change', (e) => {
                    document.querySelectorAll('.check-item').forEach(cb => cb.checked = e.target.checked);
                    toggleDeleteSelectedButton();
                });
                document.querySelectorAll('.check-item').forEach(cb => cb.addEventListener('change', toggleDeleteSelectedButton));
            }
        }

        function toggleDeleteSelectedButton() {
            const checked = document.querySelectorAll('.check-item:checked').length;
            const btn = document.getElementById('btn-delete-selected');
            if (btn) {
                if (checked > 0) btn.classList.remove('hide'); else btn.classList.add('hide');
            }
        }

        selectKelas.addEventListener('change', (e) => { 
            currentKelas = e.target.value; 
            initApp(); 
        });
        
        selectKategori.addEventListener('change', (e) => { 
            currentKategori = e.target.value; 
            localStorage.setItem('activeKategori', currentKategori);
            
            const btnAdd = document.getElementById('btn-add');
            const btnDel = document.getElementById('btn-delete-selected');
            
            if (currentKategori === 'MASTER_SISWA') {
                if(btnAdd) btnAdd.classList.remove('hide');
                if(btnSaveGrades) btnSaveGrades.classList.add('hide');
                renderMasterSiswaTable();
            } else {
                if(btnAdd) btnAdd.classList.add('hide');
                if(btnDel) btnDel.classList.add('hide');
                if(btnSaveGrades) btnSaveGrades.classList.remove('hide');
                fetchNilaiAndRender();
            }
        });

        // Live calculation of average on input change
        tableBody.addEventListener('input', (e) => {
            if (e.target.classList.contains('score-input') && currentKategori !== 'MASTER_SISWA') {
                const input = e.target;
                const idSiswa = input.dataset.id;
                const field = input.dataset.field;
                const val = input.value !== '' ? parseFloat(input.value) : '';

                if (!dataNilai[idSiswa]) dataNilai[idSiswa] = {};
                dataNilai[idSiswa][field] = val;
                updateRowAverageInstant(idSiswa);
            }
        });

        function updateRowAverageInstant(idSiswa) {
            const nilaiObj = dataNilai[idSiswa] || {};
            let total = 0, count = 0;
            for (let i = 1; i <= maxColumns; i++) {
                let v = parseFloat(nilaiObj[`n${i}`]);
                if (!isNaN(v) && v > 0) { total += v; count++; }
            }
            let rata2 = count > 0 ? (total / count).toFixed(1) : '-';
            const avgCell = document.getElementById(`avg-${idSiswa}`);
            if (avgCell) avgCell.innerText = rata2;
        }

        // ==========================================
        // TOMBOL "SIMPAN SEMUA NILAI"
        // ==========================================
        btnSaveGrades.addEventListener('click', async () => {
            const inputs = tableBody.querySelectorAll('.score-input');
            if (inputs.length === 0) return;

            Swal.fire({
                title: 'Menyimpan Nilai...',
                text: 'Sedang mengirim data ke server Firebase',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const nilaiColName = `nilai_${currentKelas}_${currentKategori}`;
                const batch = writeBatch(db);

                // Kumpulkan nilai berdasarkan siswa
                let siswaMap = {};
                inputs.forEach(input => {
                    const idSiswa = input.dataset.id;
                    const field = input.dataset.field;
                    const val = input.value !== '' ? parseFloat(input.value) : '';

                    if (!siswaMap[idSiswa]) siswaMap[idSiswa] = {};
                    siswaMap[idSiswa][field] = val;
                });

                for (let idSiswa in siswaMap) {
                    const docRef = doc(db, nilaiColName, idSiswa);
                    batch.set(docRef, siswaMap[idSiswa], { merge: true });
                }

                await batch.commit();
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil Disimpan!',
                    text: 'Semua perubahan nilai kelas ' + currentKelas + ' berhasil disimpan ke server online.',
                    timer: 2000,
                    showConfirmButton: false
                });
            } catch (err) {
                console.error(err);
                Swal.fire('Gagal Menyimpan', 'Terjadi kesalahan: ' + err.message + '<br><br>Pastikan Firestore Rules sudah diatur dengan benar.', 'error');
            }
        });

        // MODAL MANAJEMEN SISWA
        const modalForm = document.getElementById('modal-form');

        document.getElementById('btn-add').addEventListener('click', () => {
            if (currentKategori !== 'MASTER_SISWA') {
                Swal.fire('Info', 'Tambah siswa manual hanya dapat dilakukan di menu Master Data Siswa.', 'info');
                return;
            }
            document.getElementById('doc-id').value = '';
            document.getElementById('input-nama').value = '';
            document.getElementById('input-nis').value = '';
            document.getElementById('modal-title').innerText = `Tambah Siswa - Kelas ${currentKelas}`;
            modalForm.classList.remove('hide');
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => { modalForm.classList.add('hide'); });

        window.editSiswa = (id) => {
            const siswa = masterSiswa.find(s => s.id === id);
            if(!siswa) return;
            document.getElementById('doc-id').value = id;
            document.getElementById('input-nama').value = siswa.nama;
            document.getElementById('input-nis').value = siswa.nis || '';
            document.getElementById('modal-title').innerText = `Edit Data Siswa - ${siswa.nama}`;
            modalForm.classList.remove('hide');
        };

        // ==========================================
        // SIMPAN / SAVE DATA SISWA MANUAL (DENGAN TOMBOL)
        // ==========================================
        document.getElementById('data-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('doc-id').value;
            const nama = document.getElementById('input-nama').value.toUpperCase().trim();
            const nis = document.getElementById('input-nis').value.trim();
            const masterColName = `master_siswa_${currentKelas}`;

            modalForm.classList.add('hide');
            
            Swal.fire({
                title: 'Menyimpan Data Siswa...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                if (id) {
                    await updateDoc(doc(db, masterColName, id), { nama, nis });
                } else {
                    await addDoc(collection(db, masterColName), { nama, nis, timestamp: new Date() });
                }
                Swal.fire({
                    icon: 'success',
                    title: 'Data Siswa Disimpan!',
                    text: 'Data siswa berhasil disimpan ke database master kelas ' + currentKelas,
                    timer: 1500,
                    showConfirmButton: false
                });
            } catch (error) {
                console.error(error);
                Swal.fire('Gagal Menyimpan', 'Error: ' + error.message, 'error');
            }
        });

        window.deleteSiswaMaster = (id) => {
            Swal.fire({
                title: 'Hapus siswa ini?', text: 'Data siswa dari master akan dihapus.', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Hapus'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Menghapus...', didOpen: () => { Swal.showLoading(); } });
                    await deleteDoc(doc(db, `master_siswa_${currentKelas}`, id));
                    Swal.fire({ icon: 'success', title: 'Terhapus', timer: 1000, showConfirmButton: false });
                }
            });
        };

        document.getElementById('btn-delete-selected').addEventListener('click', () => {
            const checked = document.querySelectorAll('.check-item:checked');
            if(checked.length === 0) return;

            Swal.fire({
                title: `Hapus ${checked.length} siswa?`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Hapus Semua'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const masterColName = `master_siswa_${currentKelas}`;
                    const batch = writeBatch(db);
                    for(let cb of checked) { batch.delete(doc(db, masterColName, cb.value)); }
                    
                    Swal.fire({ title: 'Memproses...', didOpen: () => { Swal.showLoading(); } });
                    await batch.commit();
                    Swal.fire({ icon: 'success', title: 'Siswa terpilih dihapus', timer: 1200, showConfirmButton: false });
                }
            });
        });

        // ==========================================
        // IMPORT EXCEL MASTER SISWA (DENGAN TOMBOL & SAVE KONFIRMASI)
        // ==========================================
        document.getElementById('btn-import').addEventListener('click', () => { document.getElementById('file-excel').click(); });
        
        document.getElementById('file-excel').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                    const jsonRaw = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                    
                    if(jsonRaw.length === 0) return Swal.fire('Peringatan', 'File Excel kosong', 'warning');

                    Swal.fire({
                        title: 'Menyimpan Master Siswa...',
                        text: 'Mengunggah daftar siswa ke server...',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    const masterColName = `master_siswa_${currentKelas}`;
                    const batch = writeBatch(db);
                    let count = 0;

                    for (let row of jsonRaw) {
                        let nama = ''; let nis = '';
                        for (let key in row) {
                            let cleanKey = key.trim().toLowerCase();
                            if (cleanKey.includes('nama')) nama = row[key];
                            if (cleanKey.includes('nis')) nis = row[key];
                        }

                        if (!nama || nama.toString().trim() === '') continue; 
                        
                        let dataObj = { 
                            nama: nama.toString().toUpperCase().trim(), 
                            nis: nis.toString().trim(), 
                            timestamp: new Date() 
                        };

                        batch.set(doc(collection(db, masterColName)), dataObj);
                        count++;
                    }

                    if (count === 0) {
                        Swal.fire('Gagal Import', 'Kolom "NAMA LENGKAP" atau "NIS/NISN" tidak terbaca di Excel.', 'error');
                        document.getElementById('file-excel').value = '';
                        return;
                    }

                    await batch.commit();
                    Swal.fire('Berhasil Disimpan!', `${count} Siswa berhasil di-import dan tersimpan permanen ke Master Kelas ${currentKelas}.`, 'success');

                } catch(err) {
                    console.error(err);
                    Swal.fire('Gagal Import', 'Format Excel salah atau terjadi kesalahan: ' + err.message, 'error');
                } finally {
                    document.getElementById('file-excel').value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Export Excel
        document.getElementById('btn-export').addEventListener('click', () => {
            if(masterSiswa.length === 0) return Swal.fire('Kosong', 'Tidak ada data untuk diexport', 'info');

            let exportData = [];

            if (currentKategori === 'MASTER_SISWA') {
                masterSiswa.forEach((siswa, index) => {
                    exportData.push({ 'No': index + 1, 'NAMA LENGKAP': siswa.nama, 'NIS/NISN': siswa.nis || '' });
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exportData), "Master Siswa");
                XLSX.writeFile(wb, `Master_Siswa_Kelas_${currentKelas}.xlsx`);
            } else {
                let prefix = currentKategori === 'Tugas' ? 'T' : currentKategori === 'UH' ? 'UH' : currentKategori === 'Praktik' ? 'P' : 'N';
                masterSiswa.forEach((siswa, index) => {
                    let nilaiObj = dataNilai[siswa.id] || {};
                    let row = { 'No': index + 1, 'Nama Lengkap': siswa.nama, 'NIS/NISN': siswa.nis || '' };
                    let total = 0, count = 0;

                    for(let i=1; i<=maxColumns; i++) {
                        let val = nilaiObj[`n${i}`] !== undefined ? nilaiObj[`n${i}`] : '';
                        row[`${prefix}${i}`] = val;
                        if(val !== '') { total += parseFloat(val); count++; }
                    }
                    row['Rata-Rata'] = count > 0 ? parseFloat((total/count).toFixed(1)) : '';
                    exportData.push(row);
                });

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exportData), "Nilai");
                XLSX.writeFile(wb, `Nilai_${currentKategori}_Kelas_${currentKelas}.xlsx`);
            }
        });

    </script>
</body>
</html>
